name: ops-triage

# Read-only triage pass over production, once a day, targeting the 08:00 PT
# hour (see the schedule comment -- GitHub runs it late). Collects
# health, cron heartbeats, Railway logs, Sentry issues and the customer signal,
# then posts a report to Slack and uploads it as an artifact.
#
# It fixes nothing. Every credential below is read-only and the tool allowlist
# in scripts/ops/triage.sh is the enforcement.
#
# Phase 4.2: the shell collects every live signal into /tmp/triage-context.md
# BEFORE the model runs. The model's allowlist is read-only file tools plus
# git log/diff -- it no longer touches psql, curl or railway. See
# scripts/ops/triage.sh for why.
#
# NO webhook trigger in v1 -- deliberate. A push- or alert-triggered run would
# fire during incidents, which is exactly when a read-only agent burning API
# budget and posting to Slack is least useful. Schedule plus manual dispatch.

on:
  schedule:
    # 13:07 UTC daily = 06:07 PDT / 05:07 PST NOMINAL.
    #
    # GitHub delays this repo's schedules 2-4 h (measured 09-05/06); 06:07 PT
    # nominal lands ~08:00-09:30 PT. Off-hour minute per GitHub docs.
    #
    # Scheduled workflows are best-effort: GitHub queues them and drops them
    # entirely under load, so the nominal time is a floor, never a promise. The
    # previous '0 15 * * *' aimed at 08:00 PT and, with that lag, arrived
    # late-morning. Aiming EARLY absorbs the delay instead of adding to it.
    #
    # The ':07' is deliberate. GitHub's own docs advise against the top of the
    # hour because that is when the most jobs are queued and the delay is
    # worst; an off-hour minute is queued against less contention.
    #
    # This does NOT make the arrival time predictable -- nothing available here
    # can. If a run must happen at a known time, dispatch it by hand.
    #
    # Still daily per DECISIONS.md D7/D12. Still UTC: GitHub Actions cron has no
    # timezone option, so the PT arrival shifts an hour across DST either way.
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional free text -- something specific to look at this run'
        required: false
        type: string
      dry_run:
        description: 'Collect signals and upload the context pack WITHOUT calling the model. Cheap way to verify collection.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ops-triage
  cancel-in-progress: false

jobs:
  triage:
    name: Read-only triage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The triage prompt reads git log -20 for recent-change context.
          fetch-depth: 50

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Install psql client and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq

      - name: Verify toolchain
        run: |
          node --version
          claude --version
          railway --version
          psql --version
          jq --version

      - name: Run triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DATABASE_READONLY_URL: ${{ secrets.DATABASE_READONLY_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_FOCUS: ${{ inputs.focus }}
          TRIAGE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Scheduled runs are routine -> cheaper model. A manual run carries a
          # focus, which means a human is chasing something -> stronger model.
          MODEL: ${{ inputs.focus != '' && 'claude-opus-5' || 'claude-sonnet-5' }}
        run: |
          chmod +x scripts/ops/triage.sh
          bash scripts/ops/triage.sh

      # Always uploaded, including on a dry run and on failure. The pack is the
      # evidence: a report that claims all-green is only trustworthy alongside
      # the signals it was written from.
      - name: Upload context pack
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-context-${{ github.run_id }}
          path: /tmp/triage-context.md
          retention-days: 30
          if-no-files-found: warn

      # Per-run cost, captured from claude's JSON output. The month-to-date sum
      # across runs is NOT implemented -- see N26.
      - name: Upload cost
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: triage-cost-${{ github.run_id }}
          path: cost.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload report
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: triage-report-${{ github.run_id }}
          path: report.md
          retention-days: 30
          if-no-files-found: warn
